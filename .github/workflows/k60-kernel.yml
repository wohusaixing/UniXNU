name: K60 kernel build (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out this repository (firmware inputs)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clone the K60 core branch, device and firmware repositories
        run: |
          set -euo pipefail
          git clone --depth 1 --branch k60 --recurse-submodules --shallow-submodules \
            https://github.com/Emilelu/UniXNU core
          git clone --depth 1 https://github.com/Emilelu/UniXNU-mondrian device
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/Emilelu/uefi-mondrian uefi
          git -C core log -1 --format='core %h %s'
          echo "--- device dts memory ---"
          grep -A3 'memory@' device/dts/mondrian.dts || true
          echo "--- device board.toml dram ---"
          grep -n 'dram_size' device/board.toml || true

      - name: Apply this unit's 16 GiB DRAM window
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dts = Path('device/dts/mondrian.dts')
          text = dts.read_text()
          text = text.replace('reg = <0x0 0x80000000 0x3 0x0>;',
                              'reg = <0x0 0x80000000 0x0 0x6a000000>;')
          dts.write_text(text)
          board = Path('device/board.toml')
          content = board.read_text()
          content = content.replace('dram_size = "0x300000000"', 'dram_size = "0x6a000000"')
          board.write_text(content)
          print('patched for the 16 GiB unit')
          PY
          grep -n 'reg = <0x0 0x80000000' device/dts/mondrian.dts
          grep -n 'dram_size' device/board.toml
          git -C device log -1 --format='device %h %s'
          git -C uefi log -1 --format='uefi %h %s'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc || brew upgrade llvm lld mtools dtc || true
          command -v unifdef >/dev/null || brew install unifdef

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          for tool in git make clang cmake ninja dtc mformat mcopy; do
            printf '%-8s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done
          df -h "$GITHUB_WORKSPACE"

      - name: Stage firmware inputs and the Pong developer paths
        run: |
          set -euo pipefail
          FW="$RUNNER_TEMP/fw"
          mkdir -p "$FW"
          for f in gmu_gen70000.bin a730_sqe.fw a730_zap.mdt a730_zap.b01 a730_zap.b02; do
            cp -f "k60-inputs/fw/$f" "$FW/$f"
          done
          ls -l "$FW"
          WS="$GITHUB_WORKSPACE"
          TREE="$WS/core/out/mondrian/ipados-16.6.1-20G81/mondrian/tree"
          XCODE_DEV="$(ls -d /Applications/Xcode_*.app | tail -1)/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_DEV" >> "$GITHUB_ENV"
          sudo mkdir -p \
            /Volumes/PongDev/Applications/Xcode.app/Contents \
            /Volumes/PongDev/build/Pong-iOS16-v92-settings-adreno \
            /Volumes/PongDev/build/Pong-iOS16-v45-high-scratch \
            /Volumes/PongDev/build/Pong-iOS16-native \
            /Volumes/PongDev/build/UniXNU-XNU-iOS16/pong \
            /Volumes/PongDev/build/Pong-DarwinBoot22 \
            /Volumes/PongDev/source
          sudo ln -sfn "$XCODE_DEV" /Volumes/PongDev/Applications/Xcode.app/Contents/Developer
          sudo ln -sfn "$FW" /Volumes/PongDev/build/Pong-iOS16-v92-settings-adreno/firmware
          sudo ln -sfn "$TREE" /Volumes/PongDev/build/Pong-iOS16-v45-high-scratch/tree
          sudo ln -sfn "$TREE" /Volumes/PongDev/build/Pong-iOS16-native/tree
          sudo ln -sfn "$TREE" /Volumes/PongDev/build/UniXNU-XNU-iOS16/pong/tree
          ls -l /Volumes/PongDev/build

      - name: Run the K60 macOS preflight
        env:
          DEVICE_DIR: ${{ github.workspace }}/device
        run: |
          cd core
          bash ../device/scripts/k60-macos-preflight.sh

      - name: Configure and fetch
        run: |
          cd core
          ./unixnu defconfig mondrian_defconfig -D ../device
          ./unixnu fetch -D ../device
          ./unixnu status -D ../device 2>&1 | tail -40

      - name: Auto-boot the payload entry
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('device/board.toml')
          t = p.read_text()
          t = re.sub(r'(?m)^timeout = -1$', 'timeout = 5', t)
          p.write_text(t)
          print('payload timeout set to 5 s')
          PY
          grep -n '^timeout' device/board.toml

      - name: Add the pthread kext to the prelink roots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('core/profiles/os/ipados-16.6.1-20G81/profile.toml')
          t = p.read_text()
          if 'com.apple.kec.pthread' in t:
              print('pthread kext already in roots')
              raise SystemExit(0)
          m = re.search(r'"roots" = \[(.*?)\]\n', t, re.S)
          if not m:
              raise SystemExit('roots list not found')
          body = m.group(1).rstrip()
          if body.endswith(','):
              body = body + ' "com.apple.kec.pthread"'
          else:
              body = body + ', "com.apple.kec.pthread"'
          t = t[:m.start(1)] + body + t[m.end(1):]
          p.write_text(t)
          print('added com.apple.kec.pthread to prelink roots')
          PY
          grep -c 'com.apple.kec.pthread' core/profiles/os/ipados-16.6.1-20G81/profile.toml
          grep -n 'CONFIG_XNU_SOURCE_PTHREAD\|CONFIG_XNU_SOURCE_CORECRYPTO14' device/configs/mondrian_defconfig

      - name: Add the K60 panic-report patch (pstore publish + PSCI reset)
        run: |
          cat > device/patches/xnu/zzz-k60-panic-report.patch <<'K60PATCH'
          diff --git a/osfmk/kern/debug.c b/osfmk/kern/debug.c
          index 0a00656..451f40b 100644
          --- a/osfmk/kern/debug.c
          +++ b/osfmk/kern/debug.c
          @@ -1302,6 +1302,10 @@ debugger_collect_diagnostics(unsigned int exception, unsigned int code, unsigned
           		 */
           		SavePanicInfo(debugger_message, debugger_panic_data, debugger_panic_options);
           
          +		/* K60: persist the panic log to the Android pstore zone and reset */
          +		PE_k60_publish_panic();
          +		PE_k60_reset_now();
          +
           #if DEVELOPMENT || DEBUG
           		INJECT_NESTED_PANIC_IF_REQUESTED(PANIC_TEST_CASE_RECURPANIC_POSTLOG);
           #endif
          diff --git a/pexpert/arm/pe_init.c b/pexpert/arm/pe_init.c
          index 04dda53..478ef90 100644
          --- a/pexpert/arm/pe_init.c
          +++ b/pexpert/arm/pe_init.c
          @@ -763,6 +763,85 @@ PE_sync_panic_buffers(void)
           	}
           }
           
          +/*
          + * K60 bring-up: publish the panic text into the Android ramoops pmsg zone
          + * (0xA7200000, 2 MiB) as a persistent_ram buffer, then reset the machine so
          + * the next Android boot can expose it through /sys/fs/pstore (pmsg record).
          + */
          +#define K60_PSTORE_BASE 0xA7200000u
          +#define K60_PSTORE_SIZE 0x00200000u
          +#define K60_PSTORE_SIG  0x43474244u
          +#define K60_PSCI_SYSTEM_RESET 0x84000009u
          +
          +void
          +PE_k60_publish_panic(void)
          +{
          +	vm_offset_t base;
          +	uint32_t *hdr;
          +	unsigned int len;
          +
          +	if (!gPanicBase || !panic_info) {
          +		return;
          +	}
          +	len = panic_info->eph_panic_log_len;
          +	if (len == 0) {
          +		return;
          +	}
          +	if (len > K60_PSTORE_SIZE - 12) {
          +		len = K60_PSTORE_SIZE - 12;
          +	}
          +	base = ml_io_map_wcomb(K60_PSTORE_BASE, K60_PSTORE_SIZE);
          +	if (!base) {
          +		return;
          +	}
          +	hdr = (uint32_t *)base;
          +	hdr[0] = K60_PSTORE_SIG;
          +	hdr[1] = 0;
          +	hdr[2] = len;
          +	bcopy((const void *)(gPanicBase + panic_info->eph_panic_log_offset), (void *)(base + 12), len);
          +	CleanPoC_DcacheRegion_Force(base, 12 + len);
          +}
          +
          +static int
          +k60_psci_uses_hvc(void)
          +{
          +	DTEntry chosen;
          +	void const *prop;
          +	unsigned int size = 0;
          +	static int cached = -1;
          +
          +	if (cached >= 0) {
          +		return cached;
          +	}
          +	cached = 0;
          +	if (SecureDTLookupEntry(0, "/chosen", &chosen) == kSuccess &&
          +	    SecureDTGetProperty(chosen, "psci-method", &prop, &size) == kSuccess &&
          +	    size >= 3 && ((const char *)prop)[0] == 'h' && ((const char *)prop)[1] == 'v' &&
          +	    ((const char *)prop)[2] == 'c') {
          +		cached = 1;
          +	}
          +	return cached;
          +}
          +
          +void
          +PE_k60_reset_now(void)
          +{
          +	/* PSCI SYSTEM_RESET with the conduit the boot loader advertised. */
          +	register uint64_t x0 __asm__("x0") = (uint64_t)K60_PSCI_SYSTEM_RESET;
          +	register uint64_t x1 __asm__("x1") = 0;
          +	register uint64_t x2 __asm__("x2") = 0;
          +	register uint64_t x3 __asm__("x3") = 0;
          +
          +	if (k60_psci_uses_hvc()) {
          +		__asm__ volatile ("hvc #0" : "+r"(x0), "+r"(x1), "+r"(x2), "+r"(x3) : : "memory");
          +	} else {
          +		__asm__ volatile ("smc #0" : "+r"(x0), "+r"(x1), "+r"(x2), "+r"(x3) : : "memory");
          +	}
          +	for (;;) {
          +		__asm__ volatile ("wfe");
          +	}
          +}
          +
           static void
           pe_prepare_images(void)
           {
          diff --git a/pexpert/pexpert/pexpert.h b/pexpert/pexpert/pexpert.h
          index 769a733..72d6091 100644
          --- a/pexpert/pexpert/pexpert.h
          +++ b/pexpert/pexpert/pexpert.h
          @@ -494,6 +494,8 @@ extern uint64_t PE_nvram_stashed_x86_macos_slide;
           
           boolean_t PE_reboot_on_panic(void);
           void PE_sync_panic_buffers(void);
          +void PE_k60_publish_panic(void);
          +void PE_k60_reset_now(void);
           
           typedef struct PE_panic_save_context {
           	void *psc_buffer;
          
K60PATCH
          echo 'zzz-k60-panic-report.patch' >> device/patches/xnu/series
          tail -2 device/patches/xnu/series
          wc -l device/patches/xnu/zzz-k60-panic-report.patch

      - name: Build the XNU kernel and prelink
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd core
          ./unixnu build kernel -D ../device

      - name: Stage the device drivers the firmware package expects
        run: |
          set -euo pipefail
          TREE=core/out/mondrian/ipados-16.6.1-20G81/mondrian/tree
          mkdir -p "$TREE/drivers"
          for d in device/drivers/*/; do
            name=$(basename "$d")
            if [ ! -e "$TREE/drivers/$name" ]; then
              cp -a "$d" "$TREE/drivers/$name"
              echo "staged drivers/$name"
            fi
          done
          ls "$TREE/drivers"

      - name: Build the UEFI firmware
        run: |
          cd core
          ./unixnu build firmware --uefi ../uefi -D ../device --target DEBUG

      - name: Dump kernel-build configuration (debug)
        if: always()
        run: |
          set -x
          find core/out -maxdepth 6 -name '.config' -print -exec grep -nE 'BUILD_ARCHIVES|SOURCE_PTHREAD|SOURCE_CORECRYPTO14|CRYPTO_BOOTSTRAP' {} \; || true
          S=$(find core/out -maxdepth 8 -path '*tree/scripts/build-xnu-4k-baseline.sh' | head -1)
          echo "script=$S"
          wc -l "$S" || true
          grep -n 'CRYPTO_ARCHIVE' "$S" | head -10 || true
          sed -n '910,940p' "$S" || true

      - name: Build the payload
        run: |
          cd core
          ./unixnu build payload -D ../device

      - name: Pack the boot image
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out-artifacts"
          cd core
          DTB="$PWD/out/mondrian/ipados-16.6.1-20G81/mondrian/device-tree/hardware.dtb"
          ls -l "$DTB"
          ./unixnu bootimg --uefi ../uefi --dtb "$DTB" -D ../device -o "$GITHUB_WORKSPACE/out-artifacts/mondrian-boot.img"
          ls -l "$GITHUB_WORKSPACE/out-artifacts"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          for f in $(find core/out -type f \( -name 'kernel.macho' -o -name 'boot*.img' -o -name '*.log' -o -name 'mach.development*.unstripped*' -o -name '*.map' \) 2>/dev/null); do
            mkdir -p "artifacts/$(dirname "$f")"
            cp -f "$f" "artifacts/$f"
          done
          for f in out-artifacts/*; do
            [ -f "$f" ] && cp -f "$f" artifacts/
          done
          du -sh artifacts || true
          find artifacts -type f | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k60-boot-image
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 7
